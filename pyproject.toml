[project]
name = "quietsky"
version = "0.1.0"
description = "Find and remove aircraft Doppler traces that can geolocate audio/video recordings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
quietsky = "quietsky.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quietsky"]
